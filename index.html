<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>遗迹冒险测试</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

button{
font-size:20px;
padding:15px;
border-radius:10px;
background:#4caf50;
color:white;
border:0;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
margin-top:20px;
}
</style>

</head>


<body>


<h1>🏰 遗迹冒险</h1>


<div class="box">

<input id="name" placeholder="输入名字">

<br><br>

<button onclick="startGame()">
开始冒险
</button>


<p id="msg">
等待...
</p>


</div>



<script>

function startGame(){

let name=document.getElementById("name").value;


if(name==""){

alert("请输入名字");

return;

}


document.getElementById("msg").innerHTML=
"欢迎冒险者 "+name+"！<br>你进入了遗迹。";


}


</script>


</body>

</html>
